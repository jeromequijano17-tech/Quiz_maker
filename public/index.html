<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simple Quiz Maker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
  <div class="container"><span class="navbar-brand fw-bold">Quiz Maker</span></div>
</nav>

<main class="container py-4">
  <div id="alert"></div>

  <section class="card shadow-sm mb-4">
    <div class="card-body">
      <h1 class="h3">Simple Quiz Maker</h1>
      <p class="text-muted">Create quizzes, add multiple-choice or true/false questions, and automatically check student answers.</p>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-primary" onclick="showAdmin()">Teacher / Admin</button>
        <button class="btn btn-outline-primary" onclick="showStudent()">Take a Quiz</button>
        <button class="btn btn-outline-secondary" onclick="showResults()">Results</button>
      </div>
    </div>
  </section>

  <section id="admin" class="d-none">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5">Create Quiz</h2>
        <form id="quizForm" class="row g-2">
          <div class="col-md-5"><input id="quizTitle" class="form-control" placeholder="Quiz title" required maxlength="200"></div>
          <div class="col-md-5"><input id="quizDescription" class="form-control" placeholder="Description (optional)" maxlength="2000"></div>
          <div class="col-md-2"><button class="btn btn-success w-100">Create</button></div>
        </form>
      </div>
    </div>
    <div id="adminContent"></div>
  </section>

  <section id="student" class="d-none">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5">Available Quizzes</h2>
        <div id="quizList"></div>
      </div>
    </div>
  </section>

  <section id="quizArea" class="d-none"></section>
  <section id="results" class="d-none"></section>
</main>

<script src="/app.js"></script>
</body>
</html>
